services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: repo_educator
      POSTGRES_PASSWORD: repo_educator
      POSTGRES_DB: repo_educator
    ports:
      - "5432:5432"
    volumes:
      - repo_educator_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repo_educator"]
      interval: 2s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # 開発コンテナではテスト用の依存も入れておく（本番イメージには含めない）。
    command: >
      sh -c "pip install -q -r requirements-dev.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  repo_educator_db:
